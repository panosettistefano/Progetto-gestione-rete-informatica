# Configurazione di nginx per il frontend.
# Fa due cose: serve i file compilati dell'applicazione e gira le chiamate
# all'API verso il container dell'API.

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # L'applicazione e' una single page application: qualunque indirizzo che non
    # corrisponde a un file vero viene servito con index.html, cosi' gli
    # indirizzi interni funzionano anche se ricaricati o aperti direttamente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dentro la rete di docker compose l'API si chiama "api" e ascolta sulla 3000:
    # e' la stessa cosa che fa l'API con il database, che chiama "db".
    # Passando di qui il browser vede tutto sulla stessa origine, quindi non
    # servono ne' indirizzi assoluti ne' configurazioni CORS.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
