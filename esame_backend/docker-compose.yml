# Questo file avvia TUTTA l'infrastruttura del progetto, non solo il backend:
# il database, l'API e il frontend. Un solo "docker compose up" accende tutto,
# nell'ordine giusto, perche' ogni servizio aspetta che il precedente sia pronto.
#
# Il frontend si costruisce dalla cartella accanto (../esame_angular), quindi
# va avviato da qui:  cd esame_backend && docker compose up -d

services:

  db:
    image: mysql:8.4
    container_name: esame_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - dati_db:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: .
    container_name: esame_api
    restart: unless-stopped
    depends_on:
      # L'API parte solo quando MySQL risponde davvero, non solo quando il
      # container e' avviato: senza questo al primo avvio fallirebbe la connessione.
      db:
        condition: service_healthy
    environment:
      # Dentro la rete di compose il database si chiama "db" e ascolta sulla
      # porta standard, non sulla 3307 che serve a chi sta fuori.
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PORT: 3000
    ports:
      - "${API_PORT}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    # L'applicazione Angular compilata e servita da nginx (vedi esame_angular/Dockerfile).
    build: ../esame_angular
    container_name: esame_frontend
    restart: unless-stopped
    depends_on:
      # Parte solo con l'API gia' funzionante: nginx le gira le chiamate /api.
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dati_db:
